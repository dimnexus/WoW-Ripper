name: WoW Ripper CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust-check:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux Tauri dependencies
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Cargo check
        working-directory: src-tauri
        run: cargo check
      - name: Unit tests
        working-directory: src-tauri
        run: cargo test
