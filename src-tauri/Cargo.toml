[package]
name = "wow-ripper"
version = "0.1.0-alpha.3"
description = "Original World of Warcraft data research and extraction toolkit"
authors = ["Rooster_Roost"]
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
flate2 = "1"
casc-lib = "0.2.1"
rfd = "0.17.2"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
